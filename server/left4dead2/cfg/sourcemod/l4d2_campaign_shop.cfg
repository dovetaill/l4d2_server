// Campaign-scoped economy. Points are memory-only and reset on a new campaign or mission lost.
l4d2_campaign_shop_enable 1
l4d2_campaign_shop_max_points 250
l4d2_campaign_shop_notify 1
l4d2_campaign_shop_common_interval 20
l4d2_campaign_shop_common_reward 0
l4d2_campaign_shop_special_reward 1
l4d2_campaign_shop_witch_reward 2
l4d2_campaign_shop_tank_reward 3
l4d2_campaign_shop_revive_reward 5
l4d2_campaign_shop_rescue_reward 3
l4d2_campaign_shop_defib_reward 10
l4d2_campaign_shop_heal_reward 5

// This admin receives the configured balance whenever authenticated.
l4d2_campaign_shop_admin_steamid "76561198212288927"
l4d2_campaign_shop_admin_points 9999999


// Direct finite upgrade ammo: five times the current magazine, with a campaign reward cap.
l4d2_campaign_shop_direct_ammo_multiplier 5.0
l4d2_campaign_shop_direct_ammo_max 250
l4d2_campaign_shop_direct_ammo_kill_reward 1
l4d2_campaign_shop_direct_ammo_kill_max 20

// Temporary campaign buff; no new currency and no persistent attributes.
l4d2_campaign_shop_price_overdrive 80

