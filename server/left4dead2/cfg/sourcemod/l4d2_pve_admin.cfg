// ConVars for plugin "l4d2_pve_admin.smx"

// Show the administrator-only Mutant Tanks type menu.
l4d2_pve_admin_tank_menu "1"

// Show the administrator-only Witch management entry.
l4d2_pve_admin_witch_menu "1"

// Show the disabled Witch takeover compatibility placeholder.
// Witch control is not available in the current dependency set.
l4d2_pve_admin_witch_placeholder "1"

// Delay before applying the selected Mutant Tank type after spawning.
l4d2_pve_admin_tank_spawn_delay "0.25"

// Direct SI/Tank/Witch spawning, horde forcing, clear actions, and Tank takeover.
// Production ownership policy requires this to remain disabled.
l4d2_pve_admin_gameplay_write_enable "0"
