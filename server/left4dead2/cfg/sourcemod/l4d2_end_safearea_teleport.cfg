// Single safearea owner: random chapter opener, final team gate, and grace teleport.
l4d2_end_safearea_enable 1
l4d2_end_safearea_delay 60
l4d2_end_safearea_finale 1

// Only the selected real Survivor may perform the first standard start-door use.
l4d2_safearea_opener_enable 1
l4d2_safearea_opener_timeout 120.0

// Disable this CVar for custom maps whose checkpoint flow/door entities are known to be invalid.
// Finale escape bypasses the gate automatically; the grace teleport prevents a permanent block.
l4d2_safearea_final_gate_enable 1
l4d2_safearea_final_gate_ratio 0.70
l4d2_safearea_final_gate_near_distance 600.0
