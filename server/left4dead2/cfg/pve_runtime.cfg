hostname "CN 77 Infinite Fire"
// Operator-tunable PvPvE runtime defaults. The l4d2ctl/web panel may update these values.
sv_visiblemaxplayers 12
sv_maxplayers 31
director_special_initial_spawn_delay_min 10
director_special_initial_spawn_delay_max 20
sm_cvar director_special_respawn_interval 30
director_tank_min_interval 600
director_tank_max_interval 900
director_no_bosses 0

// Web-panel common infected limit. This cvar is cheat protected.
sm_cvar z_common_limit 100

// Modest global SI health increase. Human-controlled SI retain their PvPvE multiplier.
sm_cvar z_gas_health 290
sm_cvar z_exploding_health 60
sm_cvar z_hunter_health 290
sm_cvar z_spitter_health 115
sm_cvar z_jockey_health 375
sm_cvar z_charger_health 690
