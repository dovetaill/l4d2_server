// L4D2 PvE server baseline. Keep global identity and network settings here.
// The installer creates this untracked file with the real RCON password.
exec server_private
hostname "CN 77 Infinite Fire"
sv_password ""
sv_lan 0
sv_allow_lobby_connect_only 0
sv_search_key ""
sv_steamgroup ""
sv_steamgroup_exclusive 0
sv_cheats 0
net_public_adr "66.45.226.118"
// ASCII tags are used by the Steam browser search filters.
sv_tags "infinitefire,rpg,pve,pvpve,cn,zh"
sv_region 4
sv_force_unreserved 1
sv_visiblemaxplayers 30
sv_maxplayers 30
sv_setmax 31

z_difficulty Hard
sv_alltalk 1
sv_voiceenable 1

// The game cvar keeps magazine ammo from being consumed. Automatic Weapons handles
// held-fire behavior and the configured SCAR/AWP weapon tuning.
sm_cvar sv_infinite_ammo 1

exec pve_core
exec pve_balance

// Keep runtime tuning in the generated/private operator config.
exec pve_runtime
