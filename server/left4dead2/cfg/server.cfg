// L4D2 PvE server baseline. Keep global identity and network settings here.
// The installer creates this untracked file with the real RCON password.
exec server_private
hostname "CN 77 Infinite Fire"
sv_password ""
sv_lan 0
sv_allow_lobby_connect_only 0
sv_search_key ""
sv_steamgroup ""
sv_steamgroup_exclusive 0
sv_cheats 0
net_public_adr "66.45.226.118"
// ASCII tags are used by the Steam browser search filters.
sv_tags "infinitefire,pve,pvpve,cn,zh"
sv_region 4
sv_force_unreserved 1
// 12 public human slots + 1 hidden reservation. Engine capacity remains 31
// because Survivor bots, SI, spectators and safety headroom share MaxClients.
sv_visiblemaxplayers 12
sv_maxplayers 31
sv_setmax 31

z_difficulty Hard
sv_alltalk 1
sv_voiceenable 1

// The game cvar keeps magazine ammo from being consumed. Automatic Weapons handles
// held-fire behavior and the configured SCAR/AWP weapon tuning.
sm_cvar sv_infinite_ammo 1

exec pve_core
exec pve_balance

// Keep runtime tuning in the generated/private operator config.
exec pve_runtime

// SourceMod AutoExecConfig can run before the final dedicated-server config pass.
// Re-apply this ownership boundary last so the balancer only controls commons.
exec sourcemod/l4d2_balancer_spawn_dyn
