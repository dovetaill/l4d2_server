// L4D2 PvE server baseline. Keep global identity and network settings here.
hostname "L4D2 战役 PvPvE | 无限火力"
// The installer creates this untracked file with the real RCON password.
exec server_private
sv_password ""
sv_lan 0
sv_region 4
sv_allow_lobby_connect_only 0
sv_force_unreserved 1
sv_visiblemaxplayers 16
sv_maxplayers 16
sv_setmax 31

z_difficulty Hard
sv_alltalk 1
sv_voiceenable 1

// The game cvar keeps magazine ammo from being consumed. Automatic Weapons handles
// held-fire behavior for semi-automatic weapons without changing weapon fire intervals.
sm_cvar sv_infinite_ammo 1

exec pve_core
exec pve_balance

// Keep runtime tuning in the generated/private operator config.
exec pve_runtime
